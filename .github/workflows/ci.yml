name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: duck_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/duck_test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python3 deploy/test_services.py
      - run: node --test scripts/backup.test.mjs
      - run: python3 scripts/backup-ftp.test.py
      - run: docker compose --env-file .env.example config --no-env-resolution -q
