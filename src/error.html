<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.svg" />
    <title>%sveltekit.status% · Un couac est survenu. · TorrentsDuck2</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        document.documentElement.lang = localStorage.getItem('language') === 'en' ? 'en' : 'fr';
      } catch { /* Keep the defaults when browser storage is unavailable. */ }
    </script>
    <style>
      :root { font-family: Roboto, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); font-synthesis: none; color-scheme: dark; --bg: #11150e; --text: #e2e3d8; --muted: #c4c8b9; --accent: #b2d18a; --accent-text: #203600; --warning: #ffb86b; --shape-lg: 16px; --shape-full: 999px; }
      :root[data-theme=light] { color-scheme: light; --bg: #f9faef; --text: #1a1c16; --muted: #44483d; --accent: #496727; --accent-text: #fff; --warning: #9b4700; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; font-size: 14px; line-height: 1.5; }
      button, a { -webkit-tap-highlight-color: transparent; outline-offset: 4px; touch-action: manipulation; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); }
      button { font: inherit; border: 0; cursor: pointer; }
      .error-page { display: grid; place-items: center; min-height: 100dvh; padding: 100px 24px 56px; text-align: center; }
      section { width: min(100%, 560px); }
      .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: 1px; margin: 0 0 28px; }
      .error-code { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0 0 32px; color: var(--accent); font-size: clamp(112px, 25vw, 192px); font-weight: 700; line-height: 1; letter-spacing: -6px; }
      .pond { position: relative; }
      .middle-digit { opacity: .2; }
      .diving-duck { position: absolute; width: 1em; height: 1.07em; left: 50%; bottom: -.08em; transform: translateX(-50%); padding: 0; background: transparent; color: var(--accent); border-radius: var(--shape-lg); }
      svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .legs { stroke: var(--warning); stroke-width: 7; stroke-linecap: round; }
      .feet { fill: var(--warning); }
      .body { fill: var(--accent); }
      .wing { fill: none; stroke: var(--accent-text); stroke-width: 3; stroke-linecap: round; }
      .water { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
      .ripple { fill: none; stroke: var(--accent); stroke-width: 1.5; transform-origin: 80px 141px; animation: ripple 3s ease-in-out infinite; }
      .outer { opacity: .3; animation-delay: -1.5s; }
      h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.25; letter-spacing: -.5px; font-weight: 400; margin: 0; text-wrap: balance; }
      .description { color: var(--muted); line-height: 1.8; max-width: 360px; margin: 20px auto 28px; text-wrap: pretty; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 24px; border-radius: var(--shape-full); background: var(--accent); color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .1px; }
      .button:hover { background: color-mix(in srgb, var(--accent) 92%, var(--accent-text)); box-shadow: 0 1px 3px #0003, 0 1px 2px #0002; }
      @keyframes ripple { 50% { transform: scaleX(1.08); opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .ripple { animation: none; } }
      @media (max-width: 700px) { .error-page { padding-inline: 20px; } }
    </style>
  </head>
  <body data-status="%sveltekit.status%">
    <main class="error-page">
      <section aria-labelledby="error-title">
        <p class="eyebrow">TorrentsDuck2 · %sveltekit.status%</p>
        <audio id="quack-audio" src="/quack.mp3" preload="none"></audio>
        <div class="error-code">
          <span id="first-digit" aria-hidden="true">%sveltekit.status%</span>
          <div id="pond" class="pond" hidden>
            <span id="middle-digit" class="middle-digit" aria-hidden="true"></span>
            <button id="quack-button" class="diving-duck" type="button" aria-label="Faire coin-coin" title="Faire coin-coin">
              <svg viewBox="0 0 160 170" aria-hidden="true" focusable="false">
                <path class="water" d="M14 141a66 13 0 0 1 132 0" />
                <path class="ripple" d="M28 141a52 8 0 0 1 104 0" />
                <path class="ripple outer" d="M7 141a73 18 0 0 1 146 0" />
                <g class="duck">
                  <path class="legs" d="m66 89-9-43m36 43 13-46" />
                  <path class="feet" d="m57 48-24-7 11-8-2-13 14 8 12-5-1 17Zm49-3-14-12 11-5 6-13 6 13 13 6-14 9Z" />
                  <path class="body" d="M42 126c-8-17-4-38 12-48 9-6 18-6 26-18 8 12 17 12 26 18 16 10 20 31 12 48l-15 22H57Z" />
                  <path class="wing" d="M58 108c9-14 29-17 43-4-7 16-25 23-39 16" />
                </g>
                <path class="water" d="M14 141a66 13 0 0 0 132 0" />
                <path class="ripple" d="M28 141a52 8 0 0 0 104 0" />
                <path class="ripple outer" d="M7 141a73 18 0 0 0 146 0" />
              </svg>
            </button>
          </div>
          <span id="last-digit" aria-hidden="true" hidden></span>
        </div>
        <h1 id="error-title">Un couac est survenu.</h1>
        <p id="error-description" class="description">Impossible d’afficher cette page. Revenez à l’accueil pour continuer.</p>
        <a id="back-home" class="button" href="/">Retour à l’accueil</a>
      </section>
    </main>
    <script>
      const status = document.body.dataset.status;
      document.getElementById('first-digit').textContent = status[0];
      document.getElementById('middle-digit').textContent = status[1];
      document.getElementById('last-digit').textContent = status[2];
      document.getElementById('pond').hidden = false;
      document.getElementById('last-digit').hidden = false;
      const button = document.getElementById('quack-button');
      if (document.documentElement.lang === 'en') {
        document.getElementById('error-title').textContent = 'Something went quack.';
        document.getElementById('error-description').textContent = 'This page could not be displayed. Head back home to continue.';
        document.getElementById('back-home').textContent = 'Back to home';
        button.setAttribute('aria-label', 'Quack');
        button.title = 'Quack';
      }
      document.title = `${status} · ${document.getElementById('error-title').textContent} · TorrentsDuck2`;
      const audio = document.getElementById('quack-audio');
      button.addEventListener('click', () => {
        audio.currentTime = 0;
        void audio.play().catch(() => { /* Sound can be unavailable in the browser. */ });
      });
    </script>
  </body>
</html>
