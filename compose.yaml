name: torrentduck

x-backup-ftp:
  enabled: ${BACKUP_FTP_ENABLED:-false}
  host: ${BACKUP_FTP_HOST:-}
  port: ${BACKUP_FTP_PORT:-21}
  user: ${BACKUP_FTP_USER:-}
  password: ${BACKUP_FTP_PASSWORD:-}
  tls: ${BACKUP_FTP_TLS:-false}
  directory: ${BACKUP_FTP_DIRECTORY:-torrents-duck}
  recipient: ${BACKUP_AGE_RECIPIENT:-}
  quota_bytes: ${BACKUP_FTP_QUOTA_BYTES:-100000000000}
  keep: ${BACKUP_FTP_KEEP:-1}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-bookworm
    cgroup_parent: torrentduck-postgres.slice
    restart: unless-stopped
    environment:
      POSTGRES_DB: duck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      DUCK_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/postgres:/var/lib/postgresql/data
      - ./deploy/postgres/01-duck.sql:/docker-entrypoint-initdb.d/01-duck.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U duck -d duck]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    shm_size: 256m
    logging: *logging

  web:
    build: .
    cgroup_parent: torrentduck-web.slice
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ORIGIN: ${ORIGIN:?Set ORIGIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      QBT_URL: http://qbittorrent:8080
      QBT_USERNAME: ${QBT_USERNAME:?Set QBT_USERNAME}
      QBT_PASSWORD: ${QBT_PASSWORD:?Set QBT_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      MAILGUN_API_URL: ${MAILGUN_API_URL:-https://api.mailgun.net}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
      BODY_SIZE_LIMIT: 1073741824
      DATA_ROOT: /data
      DOWNLOADS_DIR: /data/downloads
      SHARE_DIR: /data/share
      STUDIO_DIR: /data/studio
      QBT_DOWNLOAD_PATH: /data/downloads
      FILE_DELIVERY: nginx
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/downloads:/data/downloads
      - ${DATA_ROOT:-/srv/torrentduck}/share:/data/share
      - ${DATA_ROOT:-/srv/torrentduck}/studio:/data/studio
      - /sys/fs/cgroup:/host-cgroup:ro
    networks: [edge, database, rpc, auth]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    logging: *logging

  studio:
    build:
      context: .
      target: studio
    cgroup_parent: torrentduck-studio.slice
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATA_ROOT: /data
      DOWNLOADS_DIR: /data/downloads
      SHARE_DIR: /data/share
      STUDIO_DIR: /data/studio
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/downloads:/data/downloads:ro
      - ${DATA_ROOT:-/srv/torrentduck}/share:/data/share:ro
      - ${DATA_ROOT:-/srv/torrentduck}/studio:/data/studio
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    user: 10000:10000
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 1
    logging: *logging

  qbittorrent:
    build: deploy/qbittorrent
    cgroup_parent: torrentduck-qbittorrent.slice
    restart: unless-stopped
    environment:
      QBT_USERNAME: ${QBT_USERNAME:?Set QBT_USERNAME}
      QBT_PASSWORD: ${QBT_PASSWORD:?Set QBT_PASSWORD}
      HOME: /config
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/qbittorrent:/config
      - ${DATA_ROOT:-/srv/torrentduck}/downloads:/data/downloads
    ports: ['51413:51413/tcp', '51413:51413/udp']
    networks:
      rpc: {ipv4_address: 172.30.20.2}
      torrent: {ipv4_address: 172.30.40.2, gw_priority: 1}
    sysctls: {net.ipv6.conf.all.disable_ipv6: '1'}
    user: 10000:10000
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    logging: *logging

  nginx:
    build: deploy/nginx
    cgroup_parent: torrentduck-nginx.slice
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx/site.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DATA_ROOT:-/srv/torrentduck}/certificates:/etc/letsencrypt:ro
      - ${DATA_ROOT:-/srv/torrentduck}/acme:/var/www/acme:ro
      - ${DATA_ROOT:-/srv/torrentduck}/downloads:/data/downloads:ro
      - ${DATA_ROOT:-/srv/torrentduck}/share:/data/share:ro
      - ${DATA_ROOT:-/srv/torrentduck}/studio:/data/studio:ro
    networks: [edge]
    depends_on: [web]
    read_only: true
    tmpfs: [/etc/nginx/conf.d:size=1m, /var/cache/nginx:size=64m, /var/run:size=1m]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

  ftp:
    build: deploy/ftp
    cgroup_parent: torrentduck-ftp.slice
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}
      FTP_AUTH_URL: http://web:3000/api/internal/ftp-auth
      PUBLIC_IPV4: ${PUBLIC_IPV4:?Set PUBLIC_IPV4}
    ports: ['21000:21000', '50000-50100:50000-50100']
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/ftp-tls:/etc/ssl/private:ro
      - ${DATA_ROOT:-/srv/torrentduck}/downloads:/data/downloads
      - ${DATA_ROOT:-/srv/torrentduck}/share:/data/share
    networks: [ftp_edge, auth]
    depends_on: [web]
    read_only: true
    tmpfs: [/run:size=4m, '/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, SYS_CHROOT, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    profiles: [maintenance]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ${DATA_ROOT:-/srv/torrentduck}/certificates:/etc/letsencrypt
      - ${DATA_ROOT:-/srv/torrentduck}/acme:/var/www/acme
    entrypoint: [certbot]
    logging: *logging

networks:
  edge: {ipam: {config: [{subnet: 172.30.10.0/24}]}}
  database: {internal: true, ipam: {config: [{subnet: 172.30.11.0/24}]}}
  rpc: {internal: true, ipam: {config: [{subnet: 172.30.20.0/24}]}}
  auth: {internal: true, ipam: {config: [{subnet: 172.30.30.0/24}]}}
  torrent: {ipam: {config: [{subnet: 172.30.40.0/24}]}}
  ftp_edge: {ipam: {config: [{subnet: 172.30.50.0/24}]}}
